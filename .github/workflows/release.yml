name: Release

# Build the .deb and publish a GitHub Release whenever a vMAJOR.MINOR.PATCH tag
# is pushed. The git tag is the single source of truth for the version:
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# This writes the tag version into the VERSION file and runs build_deb.sh with
# BHM_NO_BUMP=1 so the local auto-increment is skipped and the produced package
# matches the tag exactly.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    # Ubuntu 22.04 ships Qt 6.2, the oldest Qt 6 we support. Building against
    # it yields a binary that also runs on every newer Qt 6 (Mint 22 / Ubuntu
    # 24.04 with 6.4, Debian 13 with 6.8, ...), never the other way round.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            qt6-base-dev libgl-dev \
            fakeroot

      - name: Set package version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          printf '%s\n' "$version" > VERSION
          echo "PKG_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build .deb
        env:
          BHM_NO_BUMP: "1"
        run: ./build_deb.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Bluetooth Headphones Manager ${{ env.PKG_VERSION }}"
          files: bluetooth-headphones-manager_${{ env.PKG_VERSION }}_amd64.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
